# Stage 1 produces development artifacts only. Production identity/signing is Stage 21.
appId: com.colliewriter.app.dev
productName: Collie Writer
directories:
  buildResources: build
files:
  - out/main/**
  - out/preload/**
  - out/renderer/**
  # The renderer output includes the pinned PDF.js worker, CMaps, fonts and WASM.
  - package.json
  - '!node_modules/better-sqlite3/prebuilds/**'
  - '!node_modules/better-sqlite3/src/**'
  - '!node_modules/better-sqlite3/deps/**'
  - '!node_modules/better-sqlite3/binding.gyp'
  - '!node_modules/node-addon-api/**'
asar: true
allowMissingDependencies: false
extraResources:
  - from: resources
    to: collie
    filter:
      - asset-manifest.json
      - styles/*.csl
      - locales/*.xml
      - fonts/*.ttf
      - fonts/*.otf
      - vendor/paged.js
      - licenses/**
win:
  executableName: collie-writer-dev
  target: nsis
  signAndEditExecutable: false
  extraResources:
    - from: node_modules/better-sqlite3/prebuilds/win32-${arch}.node
      to: native/better_sqlite3.node
nsis:
  artifactName: collie-writer-dev-${version}-${arch}-setup.${ext}
  shortcutName: Collie Writer (Development)
  uninstallDisplayName: Collie Writer (Development)
  createDesktopShortcut: false
mac:
  target: dmg
  minimumSystemVersion: '15.0'
  identity: null
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: false
  extraResources:
    - from: node_modules/better-sqlite3/prebuilds/darwin-${arch}.node
      to: native/better_sqlite3.node
dmg:
  artifactName: collie-writer-dev-${version}-${arch}.${ext}
# better-sqlite3 13 uses Node-API 10 prebuilds; copy only the target binary above.
# Source compilation is a documented target-specific fallback, not the default.
npmRebuild: false
publish: null
