# Stage 1 produces development artifacts only. Production identity/signing is Stage 21.
appId: com.colliewriter.app.dev
productName: Collie Writer
directories:
  buildResources: build
files:
  - out/main/**
  - out/preload/**
  - out/renderer/**
  - package.json
asar: true
win:
  executableName: collie-writer-dev
  target: nsis
  signAndEditExecutable: false
nsis:
  artifactName: collie-writer-dev-${version}-${arch}-setup.${ext}
  shortcutName: Collie Writer (Development)
  uninstallDisplayName: Collie Writer (Development)
  createDesktopShortcut: false
mac:
  target: dmg
  minimumSystemVersion: '15.0'
  identity: null
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: false
dmg:
  artifactName: collie-writer-dev-${version}-${arch}.${ext}
# No native production dependencies until Stage 2 records the rebuild decision.
npmRebuild: false
publish: null
